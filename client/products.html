<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products & Price Tracker - ⚡ DropX</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <span class="brand-icon">⚡</span>
        <span class="brand-text">Drop<span>X</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/products.html" class="nav-link active">Products</a></li>
        <li><a href="/products.html?dropsOnly=true" class="nav-link">Price Drops</a></li>
        <li><a href="/index.html#categories" class="nav-link">Categories</a></li>
        <li><a href="/dashboard.html" class="nav-link">Watchlist</a></li>
      </ul>

      <div class="nav-actions">
        <button id="theme-toggle-btn" class="theme-btn" aria-label="Toggle theme">☀️</button>
        <div id="nav-auth-slot">
          <a href="/login.html" class="btn btn-outline btn-sm">Login</a>
        </div>
        <button class="mobile-toggle" aria-label="Open mobile menu">☰</button>
      </div>
    </div>
  </nav>

  <!-- Products Catalog Main Section -->
  <main class="section">
    <div class="container">
      <div class="section-header" style="margin-bottom: 24px;">
        <div>
          <h1 class="section-title">🔍 Products & Price Tracking</h1>
          <p class="section-subtitle">Real-time price monitoring and historical deals database</p>
        </div>
        <div id="results-count" style="font-size: 0.95rem; color: var(--text-muted); font-weight: 600;">
          Loading...
        </div>
      </div>

      <!-- Filter & Search Toolbar -->
      <div class="catalog-toolbar">
        <!-- Search Input -->
        <form id="catalog-search-form" style="flex: 1; min-width: 260px;">
          <div class="search-box" style="padding: 4px 6px 4px 18px;">
            <input 
              type="text" 
              id="catalog-search-input" 
              placeholder="Search products by title, brand, or model..." 
              aria-label="Search catalog"
            >
            <button type="submit" class="btn btn-primary btn-sm">Search</button>
          </div>
        </form>

        <!-- Category Pills -->
        <div class="filter-group">
          <div class="filter-pills">
            <button type="button" class="filter-pill category-pill active" data-category="All">All</button>
            <button type="button" class="filter-pill category-pill" data-category="Smartphones">Smartphones</button>
            <button type="button" class="filter-pill category-pill" data-category="Laptops">Laptops</button>
            <button type="button" class="filter-pill category-pill" data-category="PC & GPUs">PC & GPUs</button>
            <button type="button" class="filter-pill category-pill" data-category="Audio">Audio</button>
            <button type="button" class="filter-pill category-pill" data-category="Smartwatches">Smartwatches</button>
          </div>
        </div>

        <!-- Sorting & Drops Checkbox -->
        <div class="filter-group">
          <select id="sort-select" class="select-control" aria-label="Sort products">
            <option value="newest">Newest Added</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="drops">Biggest Discounts</option>
          </select>

          <label class="checkbox-label">
            <input type="checkbox" id="drops-checkbox">
            <span>Price Drops Only</span>
          </label>
        </div>
      </div>

      <!-- Product Cards Grid -->
      <div id="products-grid" class="product-grid">
        <!-- Dynamic Cards Injected by products.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 ⚡ DropX Technologies Inc. All rights reserved.</div>
        <div><a href="/index.html" style="color: var(--accent-primary);">Back to Home</a></div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
