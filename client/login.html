<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ⚡ DropX</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <span class="brand-icon">⚡</span>
        <span class="brand-text">Drop<span>X</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/products.html" class="nav-link">Products</a></li>
      </ul>

      <div class="nav-actions">
        <button id="theme-toggle-btn" class="theme-btn" aria-label="Toggle theme">☀️</button>
      </div>
    </div>
  </nav>

  <!-- Main Auth Page -->
  <div class="auth-page-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <span class="brand-icon" style="margin: 0 auto 12px; width: 44px; height: 44px;">⚡</span>
        <h2>Welcome Back</h2>
        <p>Login to track price drops and manage your alerts</p>
      </div>

      <!-- Demo Credentials Quick-Fill Hint -->
      <div class="auth-demo-hint">
        <div style="font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center;">
          <span>💡 Demo Credentials:</span>
          <button type="button" id="fill-demo-btn" class="btn btn-outline btn-sm" style="padding: 2px 8px; font-size: 0.75rem;">
            Auto-Fill
          </button>
        </div>
        <div>Email: <code>demo@dropx.com</code></div>
        <div>Password: <code>password123</code></div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-input" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Log In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/signup.html">Create an Account</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to dashboard
      if (window.Auth && window.Auth.isAuthenticated()) {
        window.location.href = '/dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      const submitBtn = document.getElementById('login-submit-btn');
      const fillDemoBtn = document.getElementById('fill-demo-btn');

      if (fillDemoBtn) {
        fillDemoBtn.addEventListener('click', () => {
          emailInput.value = 'demo@dropx.com';
          passInput.value = 'password123';
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const password = passInput.value;

        submitBtn.disabled = true;
        submitBtn.innerText = 'Verifying...';

        try {
          const res = await window.API.login(email, password);
          if (res.token && res.user) {
            window.Auth.setSession(res.token, res.user);
            window.showToast('Login successful! Redirecting...', 'success');

            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect') || '/dashboard.html';

            setTimeout(() => {
              window.location.href = redirect;
            }, 600);
          }
        } catch (error) {
          window.showToast(error.message || 'Invalid email or password', 'error');
          submitBtn.disabled = false;
          submitBtn.innerText = 'Log In';
        }
      });
    });
  </script>
</body>
</html>
